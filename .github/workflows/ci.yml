name: CI

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: make venv
      - name: Every catalog complete and well-formed, .mo files up to date
        run: make test
      - name: A wheel per language
        run: make build
      - uses: actions/upload-artifact@v4
        with:
          name: wheels
          path: dist/*.whl
