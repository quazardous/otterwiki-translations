[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "otterwiki-lang-it"
version = "0.1.0"
description = "Italian translation of An Otter Wiki's interface."
readme = "README.md"
license = "MIT"
authors = [{ name = "An Otter Wiki contributors" }]
requires-python = ">=3.11"
keywords = ["otterwiki", "wiki", "translation", "i18n", "it"]
classifiers = [
    "Framework :: Flask",
    "License :: OSI Approved :: MIT License",
    "Natural Language :: Italian",
    "Topic :: Software Development :: Localization",
]

[project.urls]
Homepage = "https://github.com/quazardous/otterwiki-translations"
Issues = "https://github.com/quazardous/otterwiki-translations/issues"

[project.entry-points.otterwiki]
lang_it = "otterwiki_lang_it"

[tool.hatch.build.targets.wheel]
packages = ["otterwiki_lang_it"]
